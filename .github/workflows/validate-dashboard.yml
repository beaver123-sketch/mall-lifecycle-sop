name: Validate dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dashboard JavaScript
        run: node --check assets/dashboard.js
      - name: Check required pages
        run: |
          test -s index.html
          test -s lifecycle.html
          test -s assets/dashboard.css
          test -s cloud-admin.html
          test -s assets/cloud-admin.js
          node --check assets/cloud-admin.js
          grep -q '商城数据中心' index.html
      - name: Install browser test client
        run: npm install --no-save --no-package-lock playwright-core@1.55.1
      - name: Verify tab switching in browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mall-ui-test.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            const cloudStub=(admin)=>[
              '(function(){',
              'const KEY="mall-test-cloud-storage";',
              'const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}};',
              'const save=s=>localStorage.setItem(KEY,JSON.stringify(s));',
              'const pub=()=>Object.values(read().reports||{});',
              'const priv=()=>Object.values(read().archives||{});',
              'window.MallCloud={',
              'get isAdmin(){return '+admin+'},',
              'init:async()=>({isAdmin:'+admin+',user:'+admin+'?{id:"e2e-admin"}:null,reports:pub(),archives:'+admin+'?priv():[],quarters:[]}),',
              'refresh:async()=>({isAdmin:'+admin+',user:'+admin+'?{id:"e2e-admin"}:null,reports:pub(),archives:'+admin+'?priv():[],quarters:[]}),',
              'putArchive:async(platform,period,archive)=>{if(!'+admin+')throw Error("guest denied");const s=read();s.archives??={};s.archives[platform+"|"+period]={platform,period,archive};save(s)},',
              'putReport:async(platform,period,report)=>{if(!'+admin+')throw Error("guest denied");const s=read();s.reports??={};s.reports[platform+"|"+period]={platform,period,report};save(s)},',
              'removeReport:async(platform,period)=>{if(!'+admin+')throw Error("guest denied");const s=read();delete s.reports?.[platform+"|"+period];save(s)},',
              'uploadSource:async(file,platform)=>{if(!'+admin+')throw Error("guest denied");return platform+"/"+file.name},',
              'removeSources:async()=>{if(!'+admin+')throw Error("guest denied")}',
              '};',
              '})();'
            ].join('\n');
            const page=await browser.newPage();
            await page.route('**/assets/cloud-layer.js*',route=>route.fulfill({status:200,contentType:'text/javascript',body:cloudStub(true)}));
            try{
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>document.documentElement.dataset.mallReady==='true',null,{timeout:25000});
              const csv=[
                '日期,商品类型,商品名称,总销量,金币金额,荣誉券金额,金币销量,荣誉券销量',
                '2026-10-10,头像框,Candy Cute Ghost（1386）,5,5000,0,5,0',
                '2026-10-10,派对背景,蓝晶权冕（1398）,8,8000,0,8,0'
              ].join(String.fromCharCode(10));
              await page.locator('#fileInput').setInputFiles({name:'mall-test.csv',mimeType:'text/csv',buffer:Buffer.from(csv,'utf8')});
              await page.waitForFunction(()=>document.querySelector('#archiveCount')?.textContent.includes('1个月'),null,{timeout:20000});
              // Month archive navigation shared by overview, new arrivals and design.
              if(await page.locator('#page-overview .month-picker').inputValue()!=='2026-10')throw Error('Overview initial month should match imported data');
              await page.locator('#page-overview [data-month-step="1"]').click();
              await page.waitForFunction(()=>
                document.querySelector('#month')?.value==='11' &&
                document.querySelector('#page-overview')?.classList.contains('month-no-data'),null,{timeout:15000});
              if(!(await page.locator('#page-overview .month-empty').isVisible()))throw Error('Missing months need explicit empty state');
              if(await page.locator('#overviewMetrics').isVisible())throw Error('Missing months must not show stale metrics');
              await page.locator('a[data-page="new"]').click();
              if(await page.locator('#page-new .month-picker').inputValue()!=='2026-11')throw Error('Month did not persist into new-arrival page');
              if(!(await page.locator('#page-new .month-empty').isVisible()))throw Error('Missing-month new-arrival notice not visible');
              await page.locator('a[data-page="design"]').click();
              if(await page.locator('#page-design .month-picker').inputValue()!=='2026-11')throw Error('Month did not persist into design page');
              if(!(await page.locator('#page-design .month-empty').isVisible()))throw Error('Design page showed data for wrong month');
              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.documentElement.dataset.mallReady==='true',null,{timeout:25000});
              if(await page.locator('#page-design .month-picker').inputValue()!=='2026-11')throw Error('Selected archive month did not survive reload');
              await page.locator('#page-design .month-picker').selectOption('2026-10');
              if(await page.locator('#month').inputValue()!=='10')throw Error('Topbar year/month controls out of sync');
              await page.locator('a[data-page="overview"]').click();
              if(await page.locator('#page-overview .month-picker').inputValue()!=='2026-10')throw Error('Month dropdown selection did not persist across tabs');
              if(!(await page.locator('#overviewMetrics').innerText()).includes('13'))throw Error('Imported month failed to restore its data');
              if(!(await page.locator('#overviewMetrics').isVisible()))throw Error('Archived month metrics did not reappear');
              if(await page.locator('body .topbar #month').isVisible())throw Error('Duplicate month picker in analysis topbar');
              // Numeric columns should share their alignment between headers and rows.
              const alignmentCheck=async(selector)=>{
                return page.locator(selector).evaluate(table=>{
                  const rows=[...table.querySelectorAll('tbody tr')].filter(row=>row.querySelectorAll('td').length>1);
                  if(!rows.length)return {ok:false,issue:'No data rows'};
                  const headers=[...table.querySelectorAll('thead th')],cells=[...rows[0].querySelectorAll('td')];
                  for(let i=0;i<headers.length;i++){
                    if(!cells[i]||!cells[i].classList.contains('num'))continue;
                    if(!headers[i].classList.contains('num'))return {ok:false,issue:'Missing numeric header class at '+i};
                    if(getComputedStyle(headers[i]).textAlign!=='right'||getComputedStyle(cells[i]).textAlign!=='right')return {ok:false,issue:'Numeric text-align mismatch at '+i};
                    const h=document.createRange();h.selectNodeContents(headers[i]);
                    const v=document.createRange();v.selectNodeContents(cells[i]);
                    if(Math.abs(h.getBoundingClientRect().right-v.getBoundingClientRect().right)>3)return {ok:false,issue:'Visible text alignment mismatch at '+i};
                  }
                  return {ok:true};
                });
              };
              await page.locator('a[data-page="design"]').click();
              await page.locator('#designCategoryRows tr').first().waitFor();
              const catAlignment=await alignmentCheck('#page-design .panel:last-child table');
              if(!catAlignment.ok)throw Error('Design category table: '+catAlignment.issue);
              const seriesAlignment=await alignmentCheck('#page-design .panel:nth-last-child(2) table');
              if(!seriesAlignment.ok)throw Error('Design series table: '+seriesAlignment.issue);
              await page.locator('a[data-page="overview"]').click();
              const overallAlignment=await alignmentCheck('#page-overview .two-cols .panel:first-child table');
              if(!overallAlignment.ok)throw Error('Overview category table: '+overallAlignment.issue);
              await page.locator('a[data-page="new"]').click();
              await page.locator('.category-tab[data-new-type="头像框"]').waitFor();
              await page.locator('.category-tab[data-new-type="头像框"]').click();
              if((await page.locator('#newRows tr').count())!==1)throw Error('New arrivals category filter failed');
              if(!(await page.locator('#newRows').innerText()).includes('Candy Cute Ghost'))throw Error('New arrivals type filter returned wrong item');
              await page.locator('a[data-page="lifecycle"]').click({timeout:20000});
              await page.waitForFunction(()=>
                location.hash==='#lifecycle' &&
                document.querySelector('a[data-page="lifecycle"]').classList.contains('active') &&
                !document.querySelector('#page-lifecycle').hidden,
                null,{timeout:20000});
              await page.frameLocator('#lifecycleFrame').locator('header.page h1').waitFor({timeout:20000});
              if(await page.frameLocator('#lifecycleFrame').locator('#v23Upload').isVisible())throw Error('Legacy upload button must be hidden');
              if(!(await page.frameLocator('#lifecycleFrame').locator('#v2Run').isVisible()))throw Error('Quarter analysis button should remain visible');
              await page.frameLocator('#lifecycleFrame').locator('.v23-month.filled').first().waitFor({state:'attached',timeout:20000});
              const lf=page.frameLocator('#lifecycleFrame');
              const filterPanel=await lf.locator('#v2-upload').boundingBox();
              const quarterControl=await lf.locator('#v2Quarter').boundingBox();
              const analyzeButton=await lf.locator('#v2Run').boundingBox();
              if(!filterPanel||!quarterControl||!analyzeButton)throw Error('Lifecycle filters not rendered');
              if(filterPanel.height>170)throw Error('Quarter filter panel is still excessively tall: '+filterPanel.height);
              if(analyzeButton.x-quarterControl.x-quarterControl.width>38)throw Error('Analyze button still far from quarter control');
              const collapsed=await lf.locator('#v2-history').evaluate(el=>el.tagName==='DETAILS'&&!el.open);
              if(!collapsed)throw Error('History section must be collapsed by default');
              if(await lf.locator('#v23-delisted .v23-guidance').isVisible())throw Error('Redundant delisted guidance must be hidden');
              for(const tab of ['overview','new','design','data']){
                await page.locator('a[data-page="'+tab+'"]').click();
                if(!(await page.locator('#page-'+tab).isVisible()))throw Error('Page failed to open: '+tab);
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
                if(overflow>5)throw Error('Page has horizontal overflow in '+tab+': '+overflow);
              }
              await page.locator('a[data-page="lifecycle"]').click();
              await page.locator('a[data-page="overview"]').click();
              await page.waitForFunction(()=>
                location.hash==='#overview' && !document.querySelector('#page-overview').hidden,
                null,{timeout:15000});
              if((await page.locator('.nav-main [data-page]').count())!==4)throw Error('Main navigation must contain four business tabs');
              if(await page.locator('.sidebar .side-group').count())throw Error('Old sidebar section labels should be removed');
              const sidebarBox=await page.locator('.sidebar').boundingBox();
              const toolsBox=await page.locator('.nav-tools').boundingBox();
              if(!sidebarBox||!toolsBox||toolsBox.y<sidebarBox.y+sidebarBox.height*0.55)throw Error('Data management must stay at the bottom');
              await page.locator('a[data-page="data"]').click();
              await page.waitForFunction(()=>
                location.hash==='#data' && !document.querySelector('#page-data').hidden &&
                document.querySelector('a[data-page="data"]').classList.contains('active'),null,{timeout:15000});
              let confirmDialogs=0;
              page.on('dialog',async dialog=>{confirmDialogs++;await dialog.dismiss()});
              const beforeRemoval=await page.locator('#fileList [data-remove]').count();
              if(beforeRemoval<1)throw Error('Test upload did not produce a removable file');
              await page.locator('#fileList [data-remove]').first().click();
              await page.waitForFunction(()=>document.querySelectorAll('#fileList [data-remove]').length===0,null,{timeout:15000});
              if(confirmDialogs)throw Error('One-click removal unexpectedly displayed a browser dialog');
              if((await page.locator('#dataDetails').innerText()).includes('2 条有效记录'))throw Error('Removing the only file did not refresh the report');
              // Bulk clear should remove only the selected month's files, never neighboring months or product IDs.
              const sample=(date,id)=>[
                '日期,商品类型,商品名称,总销量,金币金额,荣誉券金额,金币销量,荣誉券销量',
                date+',头像框,测试商品（'+id+'）,3,3000,0,3,0'
              ].join(String.fromCharCode(10));
              await page.locator('#fileInput').setInputFiles([
                {name:'oct-a.csv',mimeType:'text/csv',buffer:Buffer.from(sample('2026-10-10','1386'),'utf8')},
                {name:'oct-b.csv',mimeType:'text/csv',buffer:Buffer.from(sample('2026-10-11','1387'),'utf8')},
                {name:'sep-a.csv',mimeType:'text/csv',buffer:Buffer.from(sample('2026-09-11','1351'),'utf8')}
              ]);
              await page.waitForFunction(()=>document.querySelector('#archiveCount')?.textContent.includes('2个月'),null,{timeout:20000});
              await page.locator('a[data-page="data"]').click();
              await page.locator('#month').selectOption('10');
              await page.waitForFunction(()=>document.querySelectorAll('#fileList [data-remove]').length===2,null,{timeout:15000});
              if(await page.locator('#clearMonthFiles').isDisabled())throw Error('Bulk clear should be enabled when files exist');
              const previousDialogs=confirmDialogs;
              await page.locator('#clearMonthFiles').click();
              await page.waitForFunction(()=>
                 document.querySelectorAll('#fileList [data-remove]').length===0 &&
                 document.querySelector('#archiveCount')?.textContent.includes('1个月'),null,{timeout:15000});
              if(confirmDialogs!==previousDialogs)throw Error('Bulk clear opened an unwanted dialog');
              if(!(await page.locator('#clearMonthFiles').isDisabled()))throw Error('Bulk clear should disable after deleting all files');
              if(!(await page.locator('#dataDetails').innerText()).includes('0 条有效记录'))throw Error('Bulk clear did not refresh current-month statistics');
              if(!(await page.locator('#launchCount').innerText()).includes('20 个'))throw Error('Bulk clear unexpectedly deleted October launch IDs');
              await page.locator('#month').selectOption('9');
              if((await page.locator('#fileList [data-remove]').count())!==1)throw Error('Bulk clear unexpectedly removed September file');
              // Simulate an old IndexedDB file saved before the site moved to Supabase.
              await page.evaluate(async()=>{
                const db=await new Promise((resolve,reject)=>{
                  const req=indexedDB.open('mall-month-archive-v3',1);
                  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
                });
                const row={date:'2026-08-06',cat:'头像框',id:'1200',name:'历史头像框（1200）',
                  qty:7,gq:7,hq:0,ga:7000,ha:0,term:'',source:'legacy.csv/CSV',line:2};
                const csv='日期,商品类型,商品名称,总销量\n2026-08-06,头像框,历史头像框（1200）,7';
                await new Promise((resolve,reject)=>{
                  const tx=db.transaction('data','readwrite');
                  tx.objectStore('data').put({key:'POPPO|2026-08',platform:'POPPO',ym:'2026-08',
                    files:[{name:'legacy.csv',size:csv.length,rows:[row],issues:[],
                    blob:new File([csv],'legacy.csv',{type:'text/csv'})}],
                    savedAt:'2026-08-31T12:00:00.000Z'});
                  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
                });
                db.close();
              });
              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.documentElement.dataset.mallReady==='true',null,{timeout:25000});
              await page.locator('a[data-page="data"]').click();
              if(!(await page.locator('#cloudMigrate').isVisible()))throw Error('Existing browser archives do not trigger migration banner');
              await page.locator('#syncLocalCloud').click();
              await page.waitForFunction(()=>
                document.querySelector('#archiveCount')?.textContent.includes('2个月')
                &&document.querySelector('#cloudMigrate')?.hidden,null,{timeout:20000});
              await page.locator('#month').selectOption('8');
              if(!(await page.locator('#dataDetails').innerText()).includes('1 条有效记录'))throw Error('Historical archive did not migrate');
              // A separate browser receives only published reports, not admin's parsed row archives.
              const sharedReports=await page.evaluate(()=>localStorage.getItem('mall-test-cloud-storage'));
              const guestContext=await browser.newContext();
              const guest=await guestContext.newPage();
              await guest.addInitScript(snapshot=>localStorage.setItem('mall-test-cloud-storage',snapshot),sharedReports);
              await guest.route('**/assets/cloud-layer.js*',route=>route.fulfill({status:200,contentType:'text/javascript',body:cloudStub(false)}));
              await guest.goto('http://127.0.0.1:8765/#overview',{waitUntil:'domcontentloaded',timeout:30000});
              await guest.waitForFunction(()=>document.documentElement.dataset.mallReady==='true',null,{timeout:25000});
              await guest.locator('#page-overview .month-picker').selectOption('2026-08');
              if(!(await guest.locator('#overviewMetrics').innerText()).includes('7'))throw Error('Guest cannot see migrated historical month report');
              await guest.locator('#page-overview .month-picker').selectOption('2026-09');
              if(!(await guest.locator('#overviewMetrics').innerText()).includes('3'))throw Error('Guest cannot see published month report');
              if(await guest.locator('#headerUpload').isVisible())throw Error('Guest can see upload button');
              await guest.locator('a[data-page="data"]').click();
              if(await guest.locator('#adminDataControls').isVisible())throw Error('Guest can see private data controls');
              if(!(await guest.locator('#viewerDataPanel').isVisible()))throw Error('Guest must see read-only access');
              await guestContext.close();
              await page.locator('a[data-page="overview"]').click();
              console.log('PASS: cloud analytics sharing, guest read-only access, month isolation, and direct deletion.');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
